<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Trilochan Prabakar — Cybersecurity</title>
  <desc id="desc">A dark cyber command-center banner with cyan network traces, terminal panel, and cybersecurity portfolio title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18314a" stroke-width="1" opacity=".55"/>
      <circle cx="0" cy="0" r="1.3" fill="#22d3ee" opacity=".3"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1280" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="160" r="150" fill="#0891b2" opacity=".13" filter="url(#blur)"/>
  <path d="M0 300H1280" stroke="#22d3ee" stroke-opacity=".22"/>
  <path d="M0 306H1280" stroke="url(#glow)" stroke-width="2"/>
  <g fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".6">
    <path d="M760 0V55H850V95H930"/>
    <path d="M900 380V320H1000V285H1280"/>
    <path d="M1120 0V48H1190V95H1280"/>
    <path d="M0 80H70V125H125"/>
    <path d="M0 245H95V215H145"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="760" cy="55" r="3"/><circle cx="930" cy="95" r="3"/>
    <circle cx="1000" cy="285" r="3"/><circle cx="1190" cy="95" r="3"/>
    <circle cx="125" cy="125" r="3"/><circle cx="145" cy="215" r="3"/>
  </g>
  <g transform="translate(875 95)">
    <rect width="300" height="145" rx="12" fill="#07111f" stroke="#24506a" stroke-width="1.5"/>
    <path d="M0 34H300" stroke="#24506a"/>
    <circle cx="19" cy="17" r="4" fill="#fb7185"/>
    <circle cx="35" cy="17" r="4" fill="#fbbf24"/>
    <circle cx="51" cy="17" r="4" fill="#34d399"/>
    <text x="20" y="63" fill="#67e8f9" font-family="monospace" font-size="13">$ whoami</text>
    <text x="20" y="86" fill="#e2e8f0" font-family="monospace" font-size="13">trilochan-prabakar</text>
    <text x="20" y="111" fill="#67e8f9" font-family="monospace" font-size="13">$ focus --current</text>
    <text x="20" y="132" fill="#94a3b8" font-family="monospace" font-size="12">security • forensics • defense</text>
  </g>
  <g transform="translate(90 78)">
    <text x="0" y="18" fill="#67e8f9" font-family="monospace" font-size="13" letter-spacing="4">CYBERSECURITY / ENGINEERING</text>
    <text x="0" y="91" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="1">TRILOCHAN</text>
    <text x="0" y="151" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="1">PRABAKAR<span fill="#22d3ee">_</span></text>
    <text x="2" y="195" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2">BUILDING TOOLS. INVESTIGATING SYSTEMS. DEFENDING DIGITAL SPACE.</text>
  </g>
  <text x="90" y="348" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="2">PROFILE // INDIA // OPEN TO LEARNING & COLLABORATION</text>
  <text x="1190" y="348" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="end">[ SYSTEM ONLINE ]</text>
</svg>